name: Deploy Alzohor to Vercel

on:
  push:
    branches:
      - alzohor-deploy
    paths:
      - "alzohor-site/**"
      - ".github/workflows/deploy-alzohor.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Alzohor
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not available"
            exit 1
          fi
          vercel project add alzohor --token="$VERCEL_TOKEN" --scope="qumamediaeg-7613" || true
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope="qumamediaeg-7613" --project="alzohor" --cwd="alzohor-site"
